 background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;transition:background-color 120ms ease,border-color 120ms ease}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art{display:block;width:calc(100% + 56px);margin:6px -28px 0;height:auto;pointer-events:none}
.art .d{fill:var(--cut-deep)}.art .m{fill:var(--cut-mid)}.art .s{fill:var(--cut-soft)}.art .n{fill:var(--cut-near)}.art .b{fill:var(--cut-butter)}.art .r{fill:var(--cut-blush)}
.art .sd{fill:none;stroke:var(--cut-deep);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.art .sm{fill:none;stroke:var(--cut-mid);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* footer: same look as the suite's .mb-foot (mb-suite-topbar.css v3.3.0; this page's CSP allows inline styles only) */
.mb-foot{width:min(720px,100% - 32px);margin:0 auto 28px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:16px 2px 8px;border-top:1px solid var(--border);
 font-size:12.5px;line-height:1.5;color:var(--muted)}
.mb-foot p{margin:0;max-width:none;color:inherit}
.mb-foot-main b{color:var(--ink-2);font-weight:650}
.mb-foot-links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-right:auto}
.mb-foot-links a{color:var(--ink-2);text-decoration:none}
.mb-foot-links a:hover{color:var(--accent);text-decoration:underline}
@media (max-width:767px){.mb-foot{flex-direction:column;align-items:center;text-align:center;gap:8px}.mb-foot-links{justify-content:center;margin:0}.mb-foot-links a{min-height:32px;display:inline-flex;align-items:center}}
@media (max-width:520px){.card{padding:22px 18px 0}.art{width:calc(100% + 36px);margin:6px -18px 0}.btn{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
